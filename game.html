<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Phoenix Riser — $PHNX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: Outfit, sans-serif; background: #0c0a08; color: #e8dcc8; min-height: 100vh; overflow: hidden; touch-action: manipulation; }
        canvas { display: block; }
        .hud { position: fixed; top: 12px; left: 12px; z-index: 10; pointer-events: none; }
        .hud-row { display: flex; gap: 8px; margin-bottom: 6px; }
        .hud-item { background: rgba(0,0,0,0.75); padding: 6px 12px; border-radius: 8px; font-size: 12px; backdrop-filter: blur(4px); }
        .hud-val { font-weight: 700; }
        .hud-val.hi { color: #ff8c42; }
        .hud-val.feather { color: #ffd700; }
        .hud-val.combo { color: #00ff88; }
        .hud-val.biome { color: #c0c0c0; }
        .biome-banner { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 28px; font-weight: 700; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); opacity: 0; transition: opacity 0.5s; z-index: 20; pointer-events: none; text-align: center; }
        .biome-banner.show { opacity: 1; }
        .shop { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; flex-wrap: wrap; justify-content: center; max-width: 95vw; }
        .shop-btn { padding: 8px 12px; background: rgba(0,0,0,0.75); border: 1px solid #333; border-radius: 8px; color: #aaa; font-size: 11px; cursor: pointer; transition: all 0.15s; backdrop-filter: blur(4px); white-space: nowrap; }
        .shop-btn:hover, .shop-btn:active { border-color: #ff8c42; color: #ff8c42; }
        .shop-btn:disabled { opacity: 0.35; pointer-events: none; }
        .shop-btn .cost { color: #ffd700; }
        .combo-pop { position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%) scale(0.5); font-size: 52px; font-weight: 800; color: #ffd700; opacity: 0; z-index: 25; pointer-events: none; text-shadow: 0 0 30px rgba(255,215,0,0.6); transition: none; }
        .game-over { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .game-over.show { display: flex; }
        .game-over h2 { font-size: 28px; color: #ff8c42; margin-bottom: 8px; }
        .game-over .final { font-size: 52px; font-weight: 800; color: #ffd700; }
        .game-over .sub { color: #888; font-size: 14px; margin: 8px 0 20px; }
        .btn { padding: 12px 28px; background: linear-gradient(135deg, #ff6b35, #ff8c42); border: none; border-radius: 10px; color: #e8dcc8; font-size: 16px; font-weight: 700; cursor: pointer; margin: 6px; }
        .btn:active { transform: scale(0.96); }
        .btn-tw { background: linear-gradient(135deg, #1da1f2, #0d8ecf); }
        .stock-bar { position: fixed; top: 12px; right: 12px; z-index: 10; pointer-events: none; }
        .stock-tag { background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 10px; margin-bottom: 3px; text-align: right; }
        .stock-tag .n { color: #666; } .stock-tag .p { color: #00ff88; }
    </style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
    <div class="hud-row">
        <div class="hud-item">⬆ <span class="hud-val hi" id="hHeight">0</span>m</div>
        <div class="hud-item">🪶 <span class="hud-val feather" id="hFeathers">0</span></div>
    </div>
    <div class="hud-row">
        <div class="hud-item">🔥 <span class="hud-val combo" id="hCombo">x0</span></div>
        <div class="hud-item">🌍 <span class="hud-val biome" id="hBiome">Ground</span></div>
    </div>
</div>

<div class="stock-bar">
    <div class="stock-tag"><span class="n">NVDA</span> <span class="p">$142</span></div>
    <div class="stock-tag"><span class="n">TSLA</span> <span class="p">$248</span></div>
</div>

<div class="biome-banner" id="biomeBanner"></div>
<div class="combo-pop" id="comboPop"></div>

<div class="shop" id="shop">
    <button class="shop-btn" onclick="buy('wings')">🔥 Wings <span class="cost" id="costWings">10</span></button>
    <button class="shop-btn" onclick="buy('lightning')">⚡ Zap <span class="cost" id="costLightning">25</span></button>
    <button class="shop-btn" onclick="buy('magnet')">🧲 Magnet <span class="cost" id="costMagnet">40</span></button>
    <button class="shop-btn" onclick="buy('shield')">🛡 Shield <span class="cost" id="costShield">60</span></button>
</div>

<div class="game-over" id="go">
    <h2>🔥 Phoenix Down</h2>
    <div class="final" id="goHeight">0</div>
    <div class="sub">meters · <span id="goBiome">Ground</span></div>
    <div class="sub">Best: <span id="goBest">0</span>m</div>
    <button class="btn" onclick="restart()">🔥 Rise Again</button>
    <button class="btn btn-tw" onclick="share()">📤 Share</button>
</div>

<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W, H;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);

const BIOMES = [
    { name: 'Ground', color: '#2d1b0e', sky: '#1a0a00', threshold: 0, obstacles: 0.012, obsColor: '#553322' },
    { name: 'Troposphere', color: '#0d1b2a', sky: '#0a1520', threshold: 500, obstacles: 0.018, obsColor: '#335577' },
    { name: 'Storm Layer', color: '#1a0a2e', sky: '#0d0520', threshold: 2000, obstacles: 0.025, obsColor: '#6644aa' },
    { name: 'Stratosphere', color: '#0a1a3a', sky: '#051020', threshold: 5000, obstacles: 0.02, obsColor: '#4488cc' },
    { name: 'Space', color: '#000008', sky: '#000002', threshold: 10000, obstacles: 0.015, obsColor: '#888' }
];

const LS = 'phnx_v3';
let save = JSON.parse(localStorage.getItem(LS)||'{}');
let bestHeight = save.best || 0;
let totalFeathers = save.feathers || 0;
let upgrades = save.upgrades || { wings: 0, lightning: 0, magnet: 0, shield: 0 };

let phoenix, height, runFeathers, combo, maxCombo, comboTimer, gameActive;
let obstacles, featherDrops, particles, stars;
let shakeMag, currentBiome, lastBiomeIdx, frameCount;

const COMBO_WINDOW = 40;
const GRAVITY = 0.35;
const BASE_TAP = -11;

function power() { return 1 + upgrades.wings * 0.3 + upgrades.lightning * 0.6; }
function magnetRange() { return upgrades.magnet * 50; }
function shieldHP() { return upgrades.shield; }

function upgradeCost(type) {
    const base = { wings: 10, lightning: 25, magnet: 40, shield: 60 };
    return Math.floor(base[type] * Math.pow(1.6, upgrades[type]));
}

function init() {
    phoenix = { x: W/2, y: H-120, vy: 0, size: 22, shield: shieldHP(), squash: 1 };
    height = 0; runFeathers = 0; combo = 0; maxCombo = 0; comboTimer = 0;
    obstacles = []; featherDrops = []; particles = [];
    shakeMag = 0; currentBiome = BIOMES[0]; lastBiomeIdx = 0; frameCount = 0;
    gameActive = true;
    document.getElementById('go').classList.remove('show');
    for(let i=0;i<80;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5});
    stars = stars || [];
    if(!stars.length) for(let i=0;i<80;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5});
}
stars = [];
for(let i=0;i<80;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5});

function tap() {
    if(!gameActive) return;
    phoenix.vy = BASE_TAP - power() * 1.2;
    phoenix.squash = 0.7;
    combo++;
    comboTimer = COMBO_WINDOW;
    if(combo > maxCombo) maxCombo = combo;
    if(combo > 1 && combo % 5 === 0) showCombo(combo);
    for(let i=0;i<6;i++) particles.push({x:phoenix.x,y:phoenix.y+10,vx:(Math.random()-0.5)*5,vy:Math.random()*-3-1,life:20+Math.random()*15,hue:10+Math.random()*40});
}

function buy(type) {
    const cost = upgradeCost(type);
    if(totalFeathers >= cost) {
        totalFeathers -= cost;
        upgrades[type]++;
        saveGame();
        updateShop();
    }
}

function updateShop() {
    document.getElementById('costWings').textContent = upgradeCost('wings');
    document.getElementById('costLightning').textContent = upgradeCost('lightning');
    document.getElementById('costMagnet').textContent = upgradeCost('magnet');
    document.getElementById('costShield').textContent = upgradeCost('shield');
}

function updateHUD() {
    document.getElementById('hHeight').textContent = Math.floor(height);
    document.getElementById('hFeathers').textContent = totalFeathers + runFeathers;
    document.getElementById('hCombo').textContent = 'x' + combo;
    document.getElementById('hBiome').textContent = currentBiome.name;
}

function checkBiome() {
    let idx = 0;
    for(let i=BIOMES.length-1;i>=0;i--) { if(height>=BIOMES[i].threshold) { idx=i; break; } }
    if(idx !== lastBiomeIdx) {
        lastBiomeIdx = idx;
        currentBiome = BIOMES[idx];
        const el = document.getElementById('biomeBanner');
        el.textContent = currentBiome.name;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
    }
}

function showCombo(n) {
    const el = document.getElementById('comboPop');
    el.textContent = 'x' + n;
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%,-50%) scale(1.3)';
    setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translate(-50%,-50%) scale(0.5)'; }, 500);
}

function shake(mag) { shakeMag = Math.max(shakeMag, mag); }

function update() {
    if(!gameActive) return;
    frameCount++;
    
    if(comboTimer > 0) comboTimer--;
    else combo = 0;
    
    phoenix.vy += GRAVITY;
    phoenix.y += phoenix.vy;
    phoenix.squash += (1 - phoenix.squash) * 0.15;
    
    if(phoenix.vy < 0) height += (-phoenix.vy) * 0.3;
    
    if(phoenix.y > H + 50) {
        if(phoenix.shield > 0) {
            phoenix.shield--;
            phoenix.vy = -14;
            phoenix.y = H - 50;
            shake(8);
        } else { endGame(); }
    }
    if(phoenix.y < -50) { phoenix.y = -50; phoenix.vy = 0; }
    
    if(Math.random() < currentBiome.obstacles) {
        obstacles.push({x:Math.random()*W,y:-40,size:14+Math.random()*20,speed:2+Math.random()*2+height*0.0002,color:currentBiome.obsColor});
    }
    obstacles = obstacles.filter(o => {
        o.y += o.speed;
        const dx=phoenix.x-o.x, dy=phoenix.y-o.y;
        if(Math.sqrt(dx*dx+dy*dy) < phoenix.size+o.size) {
            if(phoenix.shield > 0) { phoenix.shield--; shake(6); spawnBurst(o.x,o.y,'#ff4444',12); return false; }
            else endGame();
        }
        return o.y < H+50;
    });
    
    if(Math.random() < 0.015) featherDrops.push({x:Math.random()*W,y:-20,size:10,speed:1.5+Math.random()});
    const mr = magnetRange();
    featherDrops = featherDrops.filter(f => {
        f.y += f.speed;
        if(mr > 0) { const dx=phoenix.x-f.x,dy=phoenix.y-f.y,dist=Math.sqrt(dx*dx+dy*dy); if(dist<mr){f.x+=dx/dist*3;f.y+=dy/dist*3;} }
        const dx=phoenix.x-f.x,dy=phoenix.y-f.y;
        if(Math.sqrt(dx*dx+dy*dy) < phoenix.size+f.size) { runFeathers+=1+Math.floor(combo*0.1); spawnBurst(f.x,f.y,'#ffd700',6); return false; }
        return f.y < H+30;
    });
    
    particles = particles.filter(p => { p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--; return p.life>0; });
    
    shakeMag *= 0.9;
    if(shakeMag < 0.5) shakeMag = 0;
    
    checkBiome();
    updateHUD();
    updateShop();
}

function spawnBurst(x,y,color,n) {
    for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:15+Math.random()*10,hue:0,color});
}

function draw() {
    cx.save();
    if(shakeMag > 0) cx.translate((Math.random()-0.5)*shakeMag,(Math.random()-0.5)*shakeMag);
    
    const grad = cx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,currentBiome.sky);
    grad.addColorStop(1,currentBiome.color);
    cx.fillStyle = grad;
    cx.fillRect(0,0,W,H);
    
    cx.fillStyle = 'rgba(255,255,255,0.3)';
    stars.forEach(s => { const py=((s.y+height*0.05)%H+H)%H; cx.beginPath();cx.arc(s.x,py,s.s,0,Math.PI*2);cx.fill(); });
    
    obstacles.forEach(o => { cx.fillStyle=o.color;cx.beginPath();cx.arc(o.x,o.y,o.size,0,Math.PI*2);cx.fill(); });
    
    featherDrops.forEach(f => { cx.fillStyle='#ffd700';cx.beginPath();cx.moveTo(f.x,f.y-6);cx.lineTo(f.x-4,f.y+4);cx.lineTo(f.x+4,f.y+4);cx.closePath();cx.fill(); });
    
    // Phoenix (Vibe Viber style)
    const sx=phoenix.squash, sy=1/sx;
    cx.save();
    cx.translate(phoenix.x,phoenix.y);
    cx.scale(sx,sy);
    
    const glow=cx.createRadialGradient(0,0,0,0,0,phoenix.size*2);
    glow.addColorStop(0,'rgba(255,140,66,0.25)');
    glow.addColorStop(1,'rgba(255,140,66,0)');
    cx.fillStyle=glow;
    cx.beginPath();cx.arc(0,0,phoenix.size*2,0,Math.PI*2);cx.fill();
    
    // Body
    cx.fillStyle='#ff4d1a';
    cx.fillRect(-phoenix.size,-phoenix.size*0.8,phoenix.size*2,phoenix.size*1.6);
    
    // Head
    cx.fillStyle='#ff4d1a';
    cx.fillRect(-12,-phoenix.size*0.8-18,24,24);
    
    // Eyes (Vibe Viber style)
    cx.fillStyle='#fff';
    cx.fillRect(-8,-phoenix.size*0.8-12,6,6);
    cx.fillRect(2,-phoenix.size*0.8-12,6,6);
    cx.fillStyle='#0a0a14';
    cx.fillRect(-6,-phoenix.size*0.8-10,3,3);
    cx.fillRect(4,-phoenix.size*0.8-10,3,3);
    
    // Feather crest
    cx.fillStyle='#ffd700';
    cx.fillRect(-2,-phoenix.size*0.8-28,4,10);
    cx.fillRect(-4,-phoenix.size*0.8-32,8,4);
    
    // Legs
    cx.fillStyle='#cc3d15';
    cx.fillRect(-8,phoenix.size*0.8-4,6,8);
    cx.fillRect(2,phoenix.size*0.8-4,6,8);
    
    if(phoenix.shield > 0) {
        cx.strokeStyle='rgba(0,255,136,0.5)';
        cx.lineWidth=3;
        cx.beginPath();cx.arc(0,0,phoenix.size+8,0,Math.PI*2);cx.stroke();
    }
    
    cx.restore();
    
    particles.forEach(p => {
        if(p.color) cx.fillStyle=p.color;
        else cx.fillStyle=`hsl(${p.hue},100%,${40+p.life}%)`;
        cx.globalAlpha=p.life/30;
        cx.beginPath();cx.arc(p.x,p.y,2.5,0,Math.PI*2);cx.fill();
    });
    cx.globalAlpha=1;
    
    cx.restore();
}

function endGame() {
    gameActive=false;
    const h=Math.floor(height);
    totalFeathers+=runFeathers;
    if(h>bestHeight) bestHeight=h;
    saveGame();
    document.getElementById('goHeight').textContent=h;
    document.getElementById('goBiome').textContent=currentBiome.name;
    document.getElementById('goBest').textContent=bestHeight;
    document.getElementById('go').classList.add('show');
}

function restart() { init(); }

function share() {
    const text=`🔥 Phoenix Riser — $PHNX\n\nI flew ${Math.floor(height)}m into ${currentBiome.name}!\nBest: ${bestHeight}m\n\nPlay: [link]\n@vibevibe_fun`;
    open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`);
}

function saveGame() { localStorage.setItem(LS,JSON.stringify({best:bestHeight,feathers:totalFeathers,upgrades})); }

addEventListener('pointerdown',e=>{if(e.target.closest('.shop')||e.target.closest('.game-over'))return;tap();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();tap();}});

function loop(){update();draw();requestAnimationFrame(loop);}
init();
loop();
</script>
</body>
</html>
